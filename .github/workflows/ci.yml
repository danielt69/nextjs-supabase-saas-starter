name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  templates:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - supabase-next
          - convex-clerk
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Intentionally runs without real secrets: env reads are build-safe
        # (lazy clients + placeholder fallbacks), so the build must be green.
        run: npm run build
