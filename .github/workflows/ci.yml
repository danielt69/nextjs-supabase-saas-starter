name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  templates:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - supabase-next
          - react-convex-clerk
          - t3
          - firebase-react
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Intentionally runs without real secrets: env reads are build-safe
        # (lazy clients + placeholder fallbacks), so the build must be green.
        # The values below are dummy placeholders, not real credentials — they
        # only satisfy tools that read env at build time (e.g. Prisma needs
        # DATABASE_URL, Vite inlines VITE_* vars).
        env:
          DATABASE_URL: "file:./dev.db"
          VITE_CONVEX_URL: "https://example.convex.cloud"
          VITE_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
          VITE_FIREBASE_API_KEY: "placeholder"
          VITE_FIREBASE_AUTH_DOMAIN: "placeholder.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "placeholder"
          VITE_FIREBASE_STORAGE_BUCKET: "placeholder.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: "1:0:web:placeholder"
        run: npm run build
